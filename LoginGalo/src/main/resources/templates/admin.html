<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Administrativa | Galo</title>
    <link rel="icon" type="image/x-icon" th:href="@{/images/galoIcon.ico}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>
<div class="page">
    <div class="login-container">
        <aside class="brand-panel">
            <div class="brand-panel-stripes"></div>
            <div class="brand-panel-glow"></div>
            <div class="brand-content">
                <div class="login-image-logo-container">
                    <img th:src="@{/images/imagemgalo.png}" alt="Escudo do Clube Atlético Mineiro">
                </div>
                <h1 class="brand-title">Galo</h1>
                <p class="brand-subtitle">Clube Atlético Mineiro</p>
                <span class="brand-badge">&#9733; Campeão Brasileiro 1971</span>
            </div>
        </aside>
        <section class="login-form">
            <div class="admin-panel-content">
                <h4 class="login-title">Área Administrativa</h4>
                <p class="login-subtitle">Bem-vindo à área administrativa</p>

                <div class="admin-divider"></div>

                <p class="admin-info">
                    Usuário: <strong th:text="${usuario}"></strong>
                </p>
                <p class="admin-info">
                    Você está acessando uma área restrita do sistema.
                </p>

                <form th:action="@{/logout}" method="post" class="admin-logout-form">
                    <button type="submit">Sair</button>
                </form>
            </div>
        </section>
    </div>
</div>
</body>

</html>
