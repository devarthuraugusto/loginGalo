<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha | Galo</title>
    <link rel="icon" type="image/x-icon" th:href="@{/images/galoIcon.ico}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/recoverpassword.css}">
</head>

<body>
<div class="page">
    <div class="login-container">
        <aside class="brand-panel">
            <div class="brand-panel-stripes"></div>
            <div class="brand-panel-glow"></div>
            <div class="brand-content">
                <div class="login-image-logo-container">
                    <img th:src="@{/images/imagemgalo.png}" alt="Escudo do Clube Atlético Mineiro">
                </div>
                <h1 class="brand-title">Galo</h1>
                <p class="brand-subtitle">Clube Atlético Mineiro</p>
                <span class="brand-badge">&#9733; Campeão Brasileiro 1971</span>
            </div>
        </aside>
        <section class="login-form">
            <form th:action="@{/recoverpassword}" method="post" class="login-form-content">
                <h4 class="login-title">Recuperar senha</h4>
                <p class="login-subtitle">Informe seu e-mail para receber as instruções de recuperação</p>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M3.5 6.5L12 13L20.5 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required autocomplete="email">
                    </div>
                </div>

                <div class="login-button-container">
                    <button type="submit">Recuperar senha</button>
                </div>

                <p class="login-redirect-options">
                    Lembrou sua senha?
                    <a class="link-primary" href="/login">Faça login</a>
                </p>
            </form>
        </section>
    </div>
</div>
</body>

</html>
