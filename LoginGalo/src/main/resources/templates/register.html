<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Galo</title>
    <link rel="icon" type="image/x-icon" th:href="@{/images/galoIcon.ico}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>

<body>
<div class="page">
    <div class="login-container register-container">
        <aside class="brand-panel">
            <div class="brand-panel-stripes"></div>
            <div class="brand-panel-glow"></div>
            <div class="brand-content">
                <div class="login-image-logo-container">
                    <img th:src="@{/images/imagemgalo.png}" alt="Escudo do Clube Atlético Mineiro">
                </div>
                <h1 class="brand-title">Galo</h1>
                <p class="brand-subtitle">Clube Atlético Mineiro</p>
                <span class="brand-badge">&#9733; Campeão Brasileiro 1971</span>
            </div>
        </aside>
        <section class="login-form">
            <form th:action="@{/register}" method="post" class="login-form-content">
                <h4 class="login-title">Junte-se à Massa</h4>
                <p class="login-subtitle">Crie sua conta e faça parte da torcida</p>

                <div class="input-row">
                    <div class="input-group">
                        <label for="name">Nome completo</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M4 21C4 16.5817 7.58172 13 12 13C16.4183 13 20 16.5817 20 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                            <input type="text" id="name" name="name" placeholder="Seu nome completo" required autocomplete="name">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="username">Usuário</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M4 21C4 16.5817 7.58172 13 12 13C16.4183 13 20 16.5817 20 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                            <input type="text" id="username" name="username" placeholder="Escolha um usuário" required autocomplete="username">
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M3.5 6.5L12 13L20.5 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required autocomplete="email">
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="password">Senha</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                            <input type="password" id="password" name="password" placeholder="Crie uma senha" required autocomplete="new-password">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="confirmPassword">Confirmar senha</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repita a senha" required autocomplete="new-password">
                        </div>
                    </div>
                </div>

                <div class="login-button-container">
                    <button type="submit">Cadastrar</button>
                </div>

                <p class="login-redirect-options">
                    Já tem uma conta?
                    <a class="link-primary" href="/login">Entrar</a>
                </p>
            </form>
        </section>
    </div>
</div>
</body>

</html>
